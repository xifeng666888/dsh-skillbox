server {
    listen 80;
    listen [::]:80;
    server_name skillbox.jushicm.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dsh-skillbox;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skillbox.jushicm.cn;

    ssl_certificate /www/server/panel/vhost/ssl/skillbox.jushicm.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/ssl/skillbox.jushicm.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SkillboxSSL:5m;
    ssl_session_timeout 10m;

    root /www/wwwroot/dsh-skillbox;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location = /data/skills.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
}
